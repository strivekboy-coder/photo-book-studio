<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拾起日常 · Photo Book Studio</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9e3d9;color:#3a3832;font-family:system-ui,"Microsoft YaHei",sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 5%;font-size:14px}a{color:inherit;text-decoration:none}.brand{font-family:Georgia,serif;letter-spacing:.06em}.title{font-size:15px}main{padding:24px 20px;min-height:70vh;display:grid;place-items:center}.sheet{width:min(1200px,100%);aspect-ratio:1.4095238095;position:relative;overflow:hidden;background:#f5f0e7;box-shadow:0 18px 70px #463b3429}.sheet.cover{width:min(580px,100%);aspect-ratio:1}.sheet img{display:block;width:100%;height:100%;object-fit:contain}nav{display:flex;justify-content:center;align-items:center;gap:20px;padding:12px 20px 30px}button{background:#f7f1e7;border:1px solid #c8bbaa;border-radius:30px;padding:12px 21px;color:#4a4238;cursor:pointer;font-size:16px}button:disabled{opacity:.3;cursor:default}#counter{font-size:13px;min-width:110px;text-align:center}footer{max-width:880px;margin:0 auto;padding:0 24px 35px;font-size:12px;line-height:1.8;color:#7b7368;text-align:center}.mobile-help{display:none}@media(max-width:700px){header{flex-wrap:wrap}.sheet:not(.cover){aspect-ratio:1}.sheet:not(.cover) img{width:200%;max-width:none;object-fit:fill}.sheet.right img{transform:translateX(-50%)}main{min-height:0;padding:20px 12px}nav{gap:10px}.title{width:100%;font-size:19px}.mobile-help{display:block;font-size:12px;text-align:center;color:#837566}}button:focus-visible,a:focus-visible{outline:2px solid #ae6550;outline-offset:4px}.sheet.cover{aspect-ratio:.7047619048;width:min(460px,100%)}</style></head><body><header><a class="brand" href="../../index.html">← PHOTO BOOK STUDIO</a><span class="title">拾起日常</span><a href="https://github.com/strivekboy-coder/photo-book-studio">GitHub ↗</a></header><main><div class="sheet cover" id="sheet"><img id="image" src="cover.jpg" alt="相册封面"></div></main><div class="mobile-help">手机上按单页阅读；点箭头，也可以左右滑动。</div><nav><button id="prev" aria-label="上一页">←</button><span id="counter"></span><button id="next" aria-label="下一页">→</button></nav><footer>效果展示相册，非真实用户故事；人物／动物关系、日期与文案为策展设定。摄影素材来自 Unsplash（含授权素材）及用户提供的授权图库。图片与相册成品仅供项目效果展示，不属于代码的 MIT 许可范围；未经许可请勿转载。<br><a href="https://github.com/strivekboy-coder/photo-book-studio/blob/codex/initial-release/examples/README.md">素材与许可说明</a></footer><script>
const album={"title": "拾起日常", "description": "同一组12张照片的独立 zine 风格研究", "selectedPhotos": 12, "viewerSpreads": 5, "pages": ["spread-02.jpg", "spread-03.jpg", "spread-04.jpg", "spread-05.jpg"], "cover": "cover.jpg", "pageRatio": 0.7047619047619048};const query=new URLSearchParams(location.search);let page=Math.max(0,Math.min(album.pages.length,Number(query.get('page'))||0)),side=page>0&&query.get('side')==='right'?1:0;const media=matchMedia('(max-width:700px)');const sheet=document.getElementById('sheet'),image=document.getElementById('image');function draw(){sheet.className='sheet'+(page===0?' cover':'')+(side?' right':'');image.src=page===0?album.cover:album.pages[page-1];image.alt=page===0?album.title+'封面':album.title+' 第'+page+'跨页';document.getElementById('counter').textContent=page===0?'封面':page+' / '+album.pages.length+(media.matches?(side?' · 右页':' · 左页'):'');document.getElementById('prev').disabled=page===0;document.getElementById('next').disabled=page===album.pages.length&&(!media.matches||side===1);const upcoming=album.pages[page];if(upcoming){const img=new Image();img.src=upcoming;}}function move(delta){if(media.matches){let leaf=page===0?0:1+(page-1)*2+side;leaf=Math.max(0,Math.min(album.pages.length*2,leaf+delta));page=leaf===0?0:1+Math.floor((leaf-1)/2);side=leaf===0?0:(leaf-1)%2;}else{page=Math.max(0,Math.min(album.pages.length,page+delta));side=0;}draw();}document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight'||e.key===' ') {e.preventDefault();move(1);}});media.addEventListener('change',()=>{side=0;draw();});let touchX=null;sheet.addEventListener('touchstart',e=>touchX=e.changedTouches[0].clientX,{passive:true});sheet.addEventListener('touchend',e=>{if(touchX!==null){const d=e.changedTouches[0].clientX-touchX;if(Math.abs(d)>45)move(d<0?1:-1);}touchX=null;},{passive:true});draw();</script></body></html>
