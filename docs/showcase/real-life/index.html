<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我们的这一年 · 真实选页 · Photo Book Studio</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9e3d9;color:#3a3832;font-family:system-ui,"Microsoft YaHei",sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 5%;font-size:14px}a{color:inherit;text-decoration:none}.brand{font-family:Georgia,serif;letter-spacing:.06em}.title{font-size:15px}main{padding:24px 20px;min-height:70vh;display:grid;place-items:center}.sheet{width:min(1200px,100%);aspect-ratio:2;position:relative;overflow:hidden;background:#f5f0e7;box-shadow:0 18px 70px #463b3429}.sheet.cover{width:min(580px,100%);aspect-ratio:1}.sheet img{display:block;width:100%;height:100%;object-fit:contain}nav{display:flex;justify-content:center;align-items:center;gap:20px;padding:12px 20px 30px}button{background:#f7f1e7;border:1px solid #c8bbaa;border-radius:30px;padding:12px 21px;color:#4a4238;cursor:pointer;font-size:16px}button:disabled{opacity:.3;cursor:default}#counter{font-size:13px;min-width:110px;text-align:center}footer{max-width:880px;margin:0 auto;padding:0 24px 35px;font-size:12px;line-height:1.8;color:#7b7368;text-align:center}.mobile-help{display:none}@media(max-width:700px){header{flex-wrap:wrap}.sheet:not(.cover){aspect-ratio:1}.sheet:not(.cover) img{width:200%;max-width:none;object-fit:fill}.sheet.right img{transform:translateX(-50%)}main{min-height:0;padding:20px 12px}nav{gap:10px}.title{width:100%;font-size:19px}.mobile-help{display:block;font-size:12px;text-align:center;color:#837566}}button:focus-visible,a:focus-visible{outline:2px solid #ae6550;outline-offset:4px}</style></head><body><header><a class="brand" href="../../index.html">← PHOTO BOOK STUDIO</a><span class="title">我们的这一年 · 真实选页</span><a href="https://github.com/strivekboy-coder/photo-book-studio">GitHub ↗</a></header><main><div class="sheet" id="sheet"><img id="image" src="spread-07.jpg" alt="真实相册第7跨页"></div></main><div class="mobile-help">手机上按单页阅读；点箭头，也可以左右滑动。</div><nav><button id="prev" aria-label="上一页">←</button><span id="counter"></span><button id="next" aria-label="下一页">→</button></nav><footer>作者真实制作相册的六个选页，展示背影、风景与旅行记忆。图片仅用于本项目作品展示，未经许可请勿转载。</footer><script>const album={"title": "我们的这一年 · 真实选页", "description": "六个背影与风景片段", "originalViewerPages": [7, 14, 15, 55, 58, 68], "pages": ["spread-07.jpg", "spread-14.jpg", "spread-15.jpg", "spread-55.jpg", "spread-58.jpg", "spread-68.jpg"], "privateSourcePublished": false, "onlySelectedSpreadsPublished": true, "postcardPersonalTextRemoved": true};const query=new URLSearchParams(location.search),media=matchMedia('(max-width:700px)');let index=Math.max(0,Math.min(album.pages.length-1,(Number(query.get('page'))||1)-1)),side=query.get('side')==='right'?1:0;const sheet=document.getElementById('sheet'),image=document.getElementById('image');function draw(){sheet.className='sheet'+(side?' right':'');image.src=album.pages[index];image.alt='原相册第'+album.originalViewerPages[index]+'跨页';document.getElementById('counter').textContent=(index+1)+' / '+album.pages.length+' · 原第'+album.originalViewerPages[index]+'跨页'+(media.matches?(side?' · 右页':' · 左页'):'');document.getElementById('prev').disabled=index===0&&(!media.matches||side===0);document.getElementById('next').disabled=index===album.pages.length-1&&(!media.matches||side===1);}function move(d){if(media.matches){const leaf=Math.max(0,Math.min(album.pages.length*2-1,index*2+side+d));index=Math.floor(leaf/2);side=leaf%2;}else{index=Math.max(0,Math.min(album.pages.length-1,index+d));side=0;}draw();}document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();move(1);}});media.addEventListener('change',()=>{side=0;draw();});let startX=null;sheet.addEventListener('touchstart',e=>startX=e.changedTouches[0].clientX,{passive:true});sheet.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-startX;if(startX!==null&&Math.abs(d)>45)move(d<0?1:-1);startX=null;},{passive:true});draw();</script></body></html>
